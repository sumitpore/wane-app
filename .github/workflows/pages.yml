name: Deploy Privacy Policy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - privacy-policy.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: privacy-policy.html
          sparse-checkout-cone-mode: false
      - name: Prepare site
        run: |
          mkdir _site
          cp privacy-policy.html _site/privacy-policy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
